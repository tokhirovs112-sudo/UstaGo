<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UstaGo</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: Arial, sans-serif; background: #f4f7f6; color: #222; }
        
        nav { 
            background: #168f5b; 
            color: white; 
            padding: 18px 8%; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }
        .logo { font-size: 25px; font-weight: bold; }
        .nav-text { font-size: 14px; }

        .hero { text-align: center; padding: 40px 20px 20px; }
        .hero h1 { font-size: 38px; margin-bottom: 8px; }
        .hero p { color: #666; font-size: 16px; margin: 0; }

        .container { max-width: 800px; margin: auto; padding: 20px; }

        /* Asosiy konteyner kartasi */
        .app-card {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            min-height: 350px;
        }

        .section-title { 
            text-align: center; 
            margin-top: 0;
            margin-bottom: 25px; 
            font-size: 22px;
        }

        .service-grid { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 16px; 
        }

        .service-card { 
            background: #f9fbf9; 
            border: 1px solid #e1ebe5;
            padding: 20px; 
            border-radius: 12px; 
            text-align: center; 
            cursor: pointer; 
            transition: 0.2s; 
        }
        .service-card:hover { 
            transform: translateY(-3px); 
            border-color: #168f5b;
            background: #fff;
        }
        .service-icon { font-size: 36px; margin-bottom: 8px; }
        .service-card h3 { margin: 0 0 6px 0; font-size: 18px; }
        .service-card p { color: #777; margin: 0; font-size: 14px; }

        .problem-buttons { 
            display: flex; 
            flex-direction: column;
            gap: 12px; 
            max-width: 400px;
            margin: auto;
        }

        .problem-btn {
            background: #f0f4f2;
            color: #222;
            border: 1px solid #ddd;
            padding: 14px 20px;
            border-radius: 10px;
            text-align: left;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
        }
        .problem-btn:hover {
            background: #168f5b;
            color: white;
            border-color: #168f5b;
        }

        .technician { 
            background: #f9fbf9; 
            border: 1px solid #e1ebe5;
            padding: 18px; 
            margin-top: 12px; 
            border-radius: 12px; 
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .technician h3 { margin: 0 0 6px 0; font-size: 18px; }
        .technician p { margin: 3px 0; font-size: 14px; color: #555; }
        .rating { color: #f0a500; font-weight: bold; }

        button.action-btn { 
            background: #168f5b; 
            color: white; 
            border: none; 
            padding: 10px 16px; 
            border-radius: 8px; 
            cursor: pointer; 
            font-size: 14px; 
        }
        button.action-btn:hover { background: #117448; }

        .back-btn {
            background: transparent;
            border: none;
            color: #168f5b;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            padding: 0;
            margin-bottom: 20px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .back-btn:hover { text-decoration: underline; }

        textarea { 
            width: 100%; 
            padding: 12px; 
            border: 1px solid #ddd; 
            border-radius: 8px; 
            font-family: Arial, sans-serif; 
            font-size: 15px; 
            resize: vertical;
        }

        footer { text-align: center; padding: 30px; margin-top: 30px; color: #777; }

        @media (max-width: 600px) {
            .service-grid { grid-template-columns: 1fr; }
            .hero h1 { font-size: 28px; }
            .technician { flex-direction: column; align-items: flex-start; gap: 12px; }
        }
    </style>
</head>
<body>

<nav>
    <div class="logo">🔧 UstaGo</div>
    <div class="nav-text">Ishonchli usta toping</div>
</nav>

<section class="hero">
    <h1>Ishonchli usta toping</h1>
    <p>Muammoingizni tanlang va yaqin atrofdagi ustalarni toping.</p>
</section>

<div class="container">
    <!-- Asosiy almashtiriluvchi blok -->
    <div class="app-card" id="app-view">
        <!-- Boshlang'ich kontent Javascript orqali yuklanadi -->
    </div>
</div>

<footer>
    © 2026 UstaGo — Mahalliy ustalarni topish platformasi
</footer>

<script>
    // Asosiy xizmatlar ko'rinishini chiqarish
    function renderCategories() {
        document.getElementById("app-view").innerHTML = `
            <h2 class="section-title">🛠️ Xizmat turini tanlang</h2>
            <div class="service-grid">
                <div class="service-card" onclick="showServices('Telefon ta’miri')">
                    <div class="service-icon">📱</div>
                    <h3>Telefon ta'miri</h3>
                    <p>Telefoningizdagi muammolar</p>
                </div>
                <div class="service-card" onclick="showServices('Kompyuter ta’miri')">
                    <div class="service-icon">💻</div>
                    <h3>Kompyuter ta'miri</h3>
                    <p>Kompyuter va laptop</p>
                </div>
                <div class="service-card" onclick="showServices('Televizor ta’miri')">
                    <div class="service-icon">📺</div>
                    <h3>Televizor ta'miri</h3>
                    <p>TV va ekran muammolari</p>
                </div>
                <div class="service-card" onclick="showServices('Kir yuvish mashinasi')">
                    <div class="service-icon">🧺</div>
                    <h3>Kir yuvish mashinasi</h3>
                    <p>Maishiy texnika ta'miri</p>
                </div>
            </div>
        `;
    }

    // Muammolarni tanlash
    function showServices(service) {
        document.getElementById("app-view").innerHTML = `
            <button class="back-btn" onclick="renderCategories()">⬅️ Orqaga</button>
            <h2 class="section-title">${service}</h2>
            <p style="text-align: center; color: #666; margin-bottom: 20px;">Muammoni tanlang:</p>
            <div class="problem-buttons">
                <button class="problem-btn" onclick="showTechnicians('${service}', 'Ishlamayapti')">🔧 Ishlamayapti</button>
                <button class="problem-btn" onclick="showTechnicians('${service}', 'Sekin ishlayapti')">⚡ Sekin ishlayapti</button>
                <button class="problem-btn" onclick="showTechnicians('${service}', 'Ekran muammosi')">🖥️ Ekran muammosi</button>
                <button class="problem-btn" onclick="showTechnicians('${service}', 'Boshqa muammo')">❓ Boshqa muammo</button>
            </div>
        `;
    }

    // Ustalar ro'yxatini chiqarish
    async function showTechnicians(service, problem) {
        try {
            let response = await fetch("/technicians");
            let technicians = await response.json();

            let html = `
                <button class="back-btn" onclick="showServices('${service}')">⬅️ Orqaga</button>
                <h2 class="section-title">${service} — ${problem}</h2>
                <p style="color: #666; margin-bottom: 15px;">👨‍🔧 Sizga mos ustalar:</p>
            `;

            technicians.forEach(function(technician) {
                let name = technician[0];
                let rating = technician[1];
                let jobs = technician[2];
                let distance = technician[3];

                html += `
                    <div class="technician">
                        <div>
                            <h3>👨‍🔧 ${name}</h3>
                            <p class="rating">⭐ ${rating} / 5</p>
                            <p>🛠️ ${jobs} ta ish bajargan | 📍 ${distance} uzoqlikda</p>
                        </div>
                        <button class="action-btn" onclick="showProfile('${service}', '${problem}', '${name}', '${rating}', '${jobs}', '${distance}')">
                            Ustani tanlash
                        </button>
                    </div>
                `;
            });

            document.getElementById("app-view").innerHTML = html;
        } catch (error) {
            document.getElementById("app-view").innerHTML = `
                <button class="back-btn" onclick="showServices('${service}')">⬅️ Orqaga</button>
                <h2 class="section-title">❌ Xatolik</h2>
                <p>Ustalarni yuklashda muammo bo'ldi.</p>
            `;
        }
    }

    // Usta profili
    function showProfile(service, problem, name, rating, jobs, distance) {
        document.getElementById("app-view").innerHTML = `
            <button class="back-btn" onclick="showTechnicians('${service}', '${problem}')">⬅️ Orqaga</button>
            <h2 class="section-title">👨‍🔧 ${name}</h2>
            <p class="rating" style="text-align: center; font-size: 18px;">⭐ ${rating} / 5</p>
            <div style="background: #f9fbf9; padding: 15px; border-radius: 10px; margin: 20px 0;">
                <p>🛠️ <b>Bajarilgan ishlar:</b> ${jobs} ta</p>
                <p>📍 <b>Masofa:</b> ${distance}</p>
                <p>📝 <b>Usta haqida:</b> Mijozlarga sifatli va kafolatlangan xizmat ko'rsatadi.</p>
            </div>
            <button class="action-btn" style="width: 100%; padding: 14px; font-size: 16px;" onclick="requestService('${service}', '${problem}', '${name}', '${rating}', '${jobs}', '${distance}')">
                📩 Ustaga murojaat qilish
            </button>
        `;
    }

    // Murojaat formasi
    function requestService(service, problem, name, rating, jobs, distance) {
        document.getElementById("app-view").innerHTML = `
            <button class="back-btn" onclick="showProfile('${service}', '${problem}', '${name}', '${rating}', '${jobs}', '${distance}')">⬅️ Orqaga</button>
            <h2 class="section-title">📨 So'rov yuborish</h2>
            <p><b>Usta:</b> ${name}</p>
            <p>Muammoingizni batafsilroq yozing:</p>
            <textarea id="problemText" rows="5" placeholder="Masalan: Ekranida muammo bor, umuman yonmayapti..."></textarea>
            <br><br>
            <button class="action-btn" style="width: 100%; padding: 14px; font-size: 16px;" onclick="sendRequest('${name}')">📤 So'rovni yuborish</button>
        `;
    }

    // So'rov yuborilgandagi holat
    function sendRequest(name) {
        let problemText = document.getElementById("problemText").value;
        if (problemText.trim() === "") {
            alert("Iltimos, muammoingizni yozing.");
            return;
        }

        document.getElementById("app-view").innerHTML = `
            <div style="text-align: center; padding: 20px 0;">
                <div style="font-size: 50px; margin-bottom: 15px;">✅</div>
                <h2 style="color: #168f5b; margin-bottom: 10px;">So'rov muvaffaqiyatli yuborildi!</h2>
                <p><b>Usta:</b> ${name}</p>
                <p style="color: #666;">Sizning so'rovingiz ustaga yetkazildi. Tez orada usta siz bilan bog'lanadi.</p>
                <br>
                <button class="action-btn" onclick="renderCategories()">Bosh sahifaga qaytish</button>
            </div>
        `;
    }

    // Sahifa yuklanganda birinchi kartalarni chiqarish
    renderCategories();
</script>
</body>
</html>
